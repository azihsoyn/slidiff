# The deck this branch would hand you about itself. View from the repo root:
#   cargo run -- examples/self.yaml
title: "slidiff v0.2: 切り出しと注釈をスキーマで強制する"
base: master
steps:
  - type: cover
    what: "agent が書き、人が端末で読む報告 deck。1 画面 1 主張"
    bullets:
      - "スライドはコードを持たず file:行範囲 で指すだけ"
      - "文量も切り出し幅もスキーマが拒否する"
      - "描画は表示時に repo から。写しは古びない"
  - type: map
    groups:
      - label: "スキーマ"
        files: ["src/deck.rs", "schema/slidiff.schema.json"]
      - label: "diff エンジン"
        files: ["src/diff/"]
      - label: "描画"
        files: ["src/ui.rs", "src/highlight.rs"]
      - label: "テスト"
        files: ["tests/"]
  - type: point
    at: "src/deck.rs:19-32"
    claim: "限界値は頼まず、形式が拒否する"
    notes:
      - line: 21
        text: "claim は 1 行分だけ"
      - line: 32
        text: "ブロック丸ごとの切り出しは通らない"
    speaker_notes: |-
      スライドに載る文はスキーマが短く強制する。ここに書いているような長い散文は
      speaker_notes だけに許され、スライドの下のパネルに出る（s で隠せる）。
      読み手が詳細を読むかどうかを選ぶ。
  - type: point
    at: "src/deck.rs:302-310"
    claim: "validation エラーは書き直しの指示文になっている"
    notes:
      - line: 306
        text: "「意味のある行に絞れ」と言い返す"
  - type: point
    at: "src/diff/git.rs:29-38"
    claim: "base は merge-base 経由。先行した base の逆差分は出ない"
  - type: before_after
    at: "src/diff/excerpt.rs:24-33"
    claim: "切り出しは diff とファイルの継ぎ接ぎで組む"
  - type: risk
    at: "tests/schema_golden.rs:20-25"
    claim: "スキーマの黙った変更は deck を書く全 agent を壊す"
    severity: medium
    notes:
      - line: 23
        text: "golden test がドリフトを意図的コミットに変える"

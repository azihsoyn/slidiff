[workspace]
members = [".", "crates/diffseen"]

[package]
name = "slidiff"
version = "0.1.0"
edition = "2024"

[dependencies]
diffseen = { path = "crates/diffseen" }
anyhow = "1.0.104"
crossterm = "0.29.0"
ratatui = "0.30.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3.27.0"
